<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specline · Diya Franklin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 56 56%27%3E%3Crect width=%2756%27 height=%2756%27 rx=%2714%27 fill=%27%232952FF%27/%3E%3Cpath d=%27M16 18h24M16 28h24M16 38h14%27 stroke=%27%23fff%27 stroke-width=%273.5%27 stroke-linecap=%27round%27 opacity=%27.45%27/%3E%3Cpath d=%27M16 28h12%27 stroke=%27%23fff%27 stroke-width=%273.5%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2733%27 cy=%2728%27 r=%275.5%27 fill=%27%232952FF%27 stroke=%27%23fff%27 stroke-width=%273%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Specline Hi-fi v2 tokens — copied from the Figma file */
  --ink:#17171A;--i2:#4E4E56;--i3:#86868F;--l:#EBEBE8;--l2:#DEDEDA;--sub:#FAFAF9;--s2:#F3F3F1;--canvas:#F7F7F5;--w:#fff;--code:#3F3F46;
  --b:#2952FF;--bBg:#EEF1FF;--bBd:#D3DBFF;--bTx:#1D3FE0;
  --okBg:#ECF7EF;--okBd:#CDEBD6;--okTx:#16803C;--ok:#22A055;
  --needBg:#FFF6E6;--needBd:#F8E1B5;--needTx:#B25E09;--need:#F59E0B;--needSoft:#FFFBF4;--needLine:#F3C877;
  --heldBg:#FDEFEE;--heldBd:#F6CFCB;--heldTx:#C0362C;--held:#EF4444;--heldLine:#F2A39C;
  --updBg:#F4F0FF;--updBd:#E2D9FD;--updTx:#6D4BD8;--upd:#8B6CF0;
  --plan:#B9B9B3;--light:#DDDDD8;--idle:#C9C9C3;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.45,.5,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--w);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
code{font-family:var(--mono);color:var(--code);font-size:.93em}
.ic{display:block;flex:none}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--b);outline-offset:2px;border-radius:6px}
#app{height:100%}
.shell{height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.grow{flex:1}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--l2);background:var(--w);font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background .15s,transform .1s,box-shadow .15s}
.btn:hover{background:var(--sub)}.btn:active{transform:translateY(1px)}
.btn.p{background:var(--b);border-color:var(--b);color:#fff;box-shadow:0 1px 2px rgba(41,82,255,.25)}.btn.p:hover{background:#1E45F0}
.btn.d{color:var(--heldTx);border-color:var(--heldBd)}.btn.d:hover{background:var(--heldBg)}
.btn.p:disabled{background:#C9D3FF;border-color:#C9D3FF;color:#fff;box-shadow:none;cursor:not-allowed;transform:none}
.btn .left{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.28);border-radius:999px;padding:1px 7px;margin-left:2px}
.apw{position:relative;display:inline-flex}.apw:hover .tip{opacity:1}
.btn.ready{animation:ready 1.4s var(--ease)}
@keyframes ready{0%{box-shadow:0 0 0 0 rgba(41,82,255,.55)}70%{box-shadow:0 0 0 12px rgba(41,82,255,0)}100%{box-shadow:0 1px 2px rgba(41,82,255,.25)}}
.btn.sm{height:30px;padding:0 11px;border-radius:8px}
.btn .okc{color:var(--okTx)}
.ib{width:28px;height:28px;border-radius:7px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--i3)}
.ib:hover{background:var(--s2);color:var(--ink)}
.ib.o{border-color:var(--l2);background:#fff}

/* pills & tags */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.t-ok{background:var(--okBg);color:var(--okTx)}.t-need{background:var(--needBg);color:var(--needTx)}.t-held{background:var(--heldBg);color:var(--heldTx)}.t-upd{background:var(--updBg);color:var(--updTx)}.t-work{background:var(--bBg);color:var(--bTx)}.t-idle{background:var(--s2);color:var(--i2)}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid;white-space:nowrap;font-family:var(--font);vertical-align:middle;position:relative;line-height:1}
.tag.ok{background:var(--okBg);border-color:var(--okBd);color:var(--okTx)}.tag.need{background:var(--needBg);border-color:var(--needBd);color:var(--needTx)}.tag.held{background:var(--heldBg);border-color:var(--heldBd);color:var(--heldTx)}.tag.upd{background:var(--updBg);border-color:var(--updBd);color:var(--updTx)}.tag.work{background:var(--bBg);border-color:var(--bBd);color:var(--bTx)}.tag.idle{background:var(--s2);border-color:var(--l);color:var(--i2)}
button.tag{cursor:pointer}
.inl{display:inline-flex;align-items:center;gap:8px;margin-left:10px;vertical-align:middle;flex-wrap:wrap}
.tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);background:var(--ink);color:#fff;border-radius:8px;padding:8px 11px;font-size:12px;line-height:1.45;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s var(--ease);z-index:40;text-align:left;font-weight:400}
.tip b{display:block;font-weight:600;font-size:13px}
.hastip:hover .tip{opacity:1;transform:translate(-50%,0)}

/* top bar */
.top{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--l);background:#fff}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;background:none;border:0;padding:0}
.logo .mk{width:26px;height:26px;border-radius:7px;background:var(--b);display:grid;place-items:center;color:#fff}
.sl{color:var(--l2);font-size:16px}
.crumb{background:none;border:0;padding:3px 4px;border-radius:6px;font-size:13px;font-weight:500;color:var(--i3)}.crumb:hover{background:var(--s2)}
.cur{font-size:13px;font-weight:600}
.ftabs{display:flex;gap:2px;margin-left:20px;align-self:flex-end;margin-bottom:-1px}
.ftab{display:flex;align-items:center;gap:7px;height:38px;padding:0 16px;border:1px solid var(--l);border-bottom:0;border-radius:9px 9px 0 0;background:var(--sub);color:var(--i3);font-weight:500;font-size:13px;position:relative;transition:background .15s,color .15s}
.ftab:hover{background:var(--s2);color:var(--i2)}.ftab.on{background:#fff;color:var(--ink);font-weight:600;height:40px;box-shadow:0 1px 0 #fff}.ftab.on:before{content:'';position:absolute;left:-1px;right:-1px;top:-1px;height:2px;border-radius:9px 9px 0 0;background:var(--b)}
.search{display:flex;align-items:center;gap:8px;width:240px;height:32px;border:1px solid var(--l);border-radius:8px;padding:0 10px;color:var(--i3);font-size:13px}
.search kbd{margin-left:auto;font-family:var(--font);font-size:11px;font-weight:500}
.av{width:30px;height:30px;border-radius:50%;background:var(--bBg);color:var(--bTx);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}

/* status bar */
.status{height:66px;flex:none;display:flex;align-items:center;gap:22px;padding:0 20px;border-bottom:1px solid var(--l);background:#fff}
.stage{display:flex;align-items:center;gap:8px;white-space:nowrap}
.stage .sd{width:8px;height:8px;border-radius:50%;transition:background .4s}
.stage b{font-size:14px;font-weight:600}.stage span{font-size:12.5px;color:var(--i3)}
.htl{position:relative;width:500px;height:40px;flex:none;margin:-6px 0 0 26px}
.htl .ms{position:absolute;top:14px;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px var(--idle);transition:.35s}
.htl .ms.dn.done{background:var(--ok)}.htl .ms.done{background:var(--ok);box-shadow:none}.htl .ms.cur{box-shadow:inset 0 0 0 2.5px var(--b),0 0 0 4px rgba(41,82,255,.15)}
.htl .mlab{position:absolute;top:26px;transform:translateX(-50%);font-size:10.5px;font-weight:500;color:var(--i3);white-space:nowrap;transition:color .3s}.htl .mlab.on{color:var(--bTx);font-weight:600}.htl .mlab.paused{color:var(--i2)}.htl .mlab b{font-weight:600}
.htl .brk{position:absolute;top:22px;height:5px;border:1.5px solid var(--l2);border-top:0;border-radius:0 0 4px 4px;transition:border-color .3s}.htl .brk.on{border-color:var(--bBd)}
.htl .dot.hs .n,.htl .dot.hs .ring{transform:scale(1.5)}
.htl .seg{position:absolute;top:13px;height:2px;border-radius:2px;background:var(--light);overflow:hidden}
.htl .seg.plan{background:var(--plan)}
.htl .seg.gap{background:none;border-top:1.5px dashed var(--need);height:0;top:13.5px;overflow:visible}
.htl .seg i{position:absolute;inset:0;background:var(--ok);transform-origin:left;transform:scaleX(0);transition:transform .7s var(--ease)}
.htl .seg.ok{height:3px;top:12.5px}.htl .seg.ok i{transform:scaleX(1)}
.htl .dot{position:absolute;top:14px;transform:translate(-50%,-50%);border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.htl .dot:hover .n{transform:scale(1.35)}
.n{border-radius:50%;transition:background .35s,border-color .35s,transform .25s var(--spring),width .3s,height .3s}
.n.ok{width:7px;height:7px;background:var(--ok)}.n.upd{width:7px;height:7px;background:var(--upd)}.n.plan{width:7px;height:7px;background:var(--plan)}
.n.idle{width:7px;height:7px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--idle)}
.n.need{width:9px;height:9px;background:var(--need);box-shadow:0 0 0 3px rgba(245,158,11,.22)}
.n.held{width:9px;height:9px;background:var(--held);box-shadow:0 0 0 3px rgba(239,68,68,.22)}
.n.gap{width:9px;height:9px;background:#fff;box-shadow:inset 0 0 0 2px var(--need)}
.n.pop{animation:pop .45s var(--spring)}
.ring{border-radius:50%;background:#fff;display:grid;place-items:center;transition:box-shadow .3s}
.ring i{border-radius:50%;animation:breathe 1.6s ease-in-out infinite}
.ring.work{box-shadow:inset 0 0 0 2.5px var(--b),0 1px 6px rgba(41,82,255,.3)}.ring.work i{background:var(--b)}
.ring.paused{box-shadow:inset 0 0 0 2.5px var(--i3)}.ring.paused i{background:var(--i3);animation:none}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.6)}}
.htl .fq{position:absolute;top:14px;width:9px;height:9px;border-radius:2px;transform:translate(-50%,-50%);background:#fff;box-shadow:inset 0 0 0 1.5px var(--idle);transition:.4s}
.htl .fq.on{box-shadow:inset 0 0 0 2px var(--b),0 0 6px rgba(41,82,255,.35)}.htl .fq.done{background:var(--ok);box-shadow:none}
.htl .dn-old{position:absolute;top:14px;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);background:#fff;box-shadow:inset 0 0 0 1.5px var(--idle);display:grid;place-items:center;transition:.4s}
.htl .dn i{width:5px;height:5px;border-radius:50%;background:var(--idle)}.htl .dn.done{background:var(--ok);box-shadow:none}.htl .dn.done i{background:#fff}
.htl .lbl{position:absolute;top:-22px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11.5px;padding:3px 7px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:.15s}
.htl .dot:hover .lbl{opacity:1;top:-26px}
.count{font-size:13px;color:var(--i2);white-space:nowrap}.count b{color:var(--ink);font-weight:600;display:inline-block}
.roll{animation:rollin .45s var(--spring)}@keyframes rollin{from{transform:translateY(60%);opacity:0}}
.needs{display:inline-flex;align-items:center;gap:0;white-space:pre;font-size:13px;font-weight:600;color:var(--needTx);white-space:nowrap;animation:fade .3s}
.needs.held{color:var(--heldTx)}.needs b{font-weight:600;display:inline-block}
.needs .nd{margin-right:8px;width:7px;height:7px;border-radius:50%;background:var(--need);box-shadow:0 0 0 3px rgba(245,158,11,.18)}.needs.held .nd{background:var(--held);box-shadow:0 0 0 3px rgba(239,68,68,.18)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 11px;border-radius:999px;border:1px solid;font-weight:600;font-size:13px;background:var(--needBg);border-color:var(--needBd);color:var(--needTx);animation:pop .4s var(--spring)}
.chip.held{background:var(--heldBg);border-color:var(--heldBd);color:var(--heldTx)}
.chip:hover{filter:brightness(.98)}

/* view bar */
.viewbar{height:53px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--l);background:#fff}
.tog{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--i2);font-weight:500;font-size:13px}
.tog:hover{background:var(--sub)}.tog.on{background:var(--bBg);color:var(--bTx)}
.segc{display:flex;background:var(--s2);border-radius:9px;padding:3px;position:relative}
.segc button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;height:28px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--i3);font-weight:500;font-size:13px;transition:color .2s}
.segc button.on{color:var(--ink);font-weight:600}
.segc .knob{position:absolute;top:3px;bottom:3px;border-radius:7px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:left .3s var(--ease),width .3s var(--ease)}
.hint{font-size:12px;color:var(--i3);margin-left:auto;text-align:right}
.vsep{width:1px;height:20px;background:var(--l);flex:none}
.vtabs{display:flex;align-self:stretch;align-items:flex-end;gap:4px;margin-bottom:-1px;margin-right:4px}
.vtab{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--l);border-bottom:0;border-radius:10px 10px 0 0;background:var(--sub);font-size:14px;font-weight:500;color:var(--i2);position:relative;transition:background .15s,color .15s}
.vtab small{font-family:var(--mono);font-size:11px;color:var(--i3);font-weight:400}
.vtab:hover{background:var(--s2);color:var(--ink)}
.vtab.on{height:44px;color:var(--ink);font-weight:600;border-color:var(--l2);z-index:1}.vtab.on:before{content:'';position:absolute;left:-1px;right:-1px;top:-1px;height:2.5px;border-radius:10px 10px 0 0;background:var(--b)}
.olbtn{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--l2);border-radius:8px;background:#fff;font-size:13px;font-weight:500;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background .15s,border-color .15s}
.olbtn:hover{background:var(--sub)}.olbtn.on{background:var(--bBg);border-color:var(--bBd);color:var(--bTx)}
.vlab{font-size:12px;font-weight:500;color:var(--i3);margin-right:-6px}
.editbar{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 20px;background:var(--sub);border-bottom:1px solid var(--l);animation:fade .25s}
.ebi{width:24px;height:24px;border-radius:6px;background:var(--bBg);color:var(--bTx);display:grid;place-items:center}
.ebt{font-size:13px;color:var(--i2);margin-left:4px}.ebt b{color:var(--ink);font-weight:600}
.ebb{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--l);border-radius:8px;background:#fff;font-size:13px;font-weight:500;color:var(--ink)}
.ebb:hover:not(:disabled){background:var(--s2)}.ebb.on{background:#FEF3C7;border-color:#F8E1B5;color:var(--needTx)}.ebb:disabled{color:var(--i3);background:transparent;border-color:transparent;cursor:default}
.ebh{font-size:12px;color:var(--i3);margin-left:4px}
.dtools{display:flex;align-items:center;gap:4px;animation:fade .25s}.dsep{width:1px;height:20px;background:var(--l);margin:0 6px 0 2px}.tog:disabled{color:var(--i3);opacity:.55;cursor:default;background:none}
.mbtns{position:absolute;display:flex;flex-direction:column;gap:6px;animation:pop .25s var(--spring);transition:top .25s var(--ease)}
.mbtn{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--l);box-shadow:0 4px 12px rgba(0,0,0,.08);display:grid;place-items:center;color:var(--i2);position:relative}
.mbtn:hover{color:var(--bTx);border-color:var(--bBd);background:var(--bBg)}.mbtn.on{color:var(--needTx);background:var(--needBg);border-color:var(--needBd)}
.mbtn .mt{position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s}.mbtn:hover .mt{opacity:1}

/* main */
.main{transition:margin-right .5s var(--ease),grid-template-columns .45s var(--ease)!important;flex:1;min-height:0;display:grid;grid-template-columns:var(--ol,0px) minmax(0,1fr) var(--pane,0px);transition:grid-template-columns .45s var(--ease)}
.outline{overflow:hidden;background:var(--sub);border-right:1px solid var(--l);min-width:0}
.ol-in{width:260px;padding:18px 10px;height:100%;overflow:auto}
.ol-h{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--i3);padding:0 8px 10px}.ol-h span{font-weight:400}
.ol-it{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:1px solid transparent;border-radius:8px;background:none;text-align:left;font-size:13px;color:var(--ink);margin-bottom:2px}
.ol-it:hover{background:var(--s2)}.ol-it.cur{background:#fff;border-color:var(--l);font-weight:500}
.ol-d{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none}
.scroller{overflow:auto;position:relative;min-width:0;background:var(--canvas)}
.scroller.white{background:#fff}
.pane{overflow:hidden;background:#fff;border-left:1px solid var(--l);min-width:0}
.pane-in{width:800px;height:100%;overflow:auto;padding:22px 22px 40px 20px}

/* sections view */
.secs{position:relative;padding:32px var(--pr,112px) 120px var(--pl,112px)}
.ptitle{font-size:32px;font-weight:500;letter-spacing:-.02em;margin:0}
.psub{font-size:15px;color:var(--i2);margin:8px 0 24px}
.stack{display:flex;flex-direction:column;gap:10px}
.sec{background:#fff;border:1px solid var(--l);border-radius:14px;transition:border-color .3s,box-shadow .3s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sec.need{border-color:var(--needLine)}.sec.held{border-color:var(--heldLine)}.sec.work{border-color:var(--bBd)}.sec.paused{background:#fff}
.sh{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;cursor:pointer;border-radius:14px;transition:background .2s}
.sh:hover{background:var(--sub)}
.sec.open .sh{border-radius:14px 14px 0 0}
.sec.work .sh{background:var(--bBg)}.sec.paused.open .sh{background:var(--s2)}
.chev{color:var(--i3);transition:transform .3s var(--ease)}.sec.open .chev{transform:rotate(180deg)}
.sname{font-size:16px;font-weight:600}
.smeta{margin-left:auto;font-size:13px;color:var(--i3);white-space:nowrap}
.coll{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}.coll.open{grid-template-rows:1fr}.coll>div{overflow:hidden;min-height:0}

.sb{border-top:1px solid var(--l);padding:12px 20px 14px}
.ln{position:relative;font-size:17px;line-height:28px;padding:4px 0;border-radius:6px}
.ln .tx{border-radius:6px;padding:0 4px;margin:0 -4px;outline:none;transition:background .3s}
.ln.cur .tx{background:linear-gradient(90deg,transparent,rgba(41,82,255,.10),transparent);background-size:220% 100%;animation:shim 1.7s linear infinite}
@keyframes shim{from{background-position:160% 0}to{background-position:-60% 0}}
.ln.chk .tx{background:var(--okBg)}
.ln.hl{background:var(--needSoft);box-shadow:-10px 0 0 var(--needSoft),-12px 0 0 var(--need)}
.ln.sel .tx{background:var(--bBg)}

.act{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--bTx);margin-top:8px}

.stopped{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--i2);margin:8px 0 6px}

.whyrow{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--i2);margin-top:8px}

/* decisions card */
.dc{border:1.5px solid var(--needLine);background:#fff;border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:inset 4px 0 0 var(--need),0 2px 12px rgba(245,158,11,.12);transition:border-color .4s,box-shadow .4s}

.dch{display:flex;align-items:center;gap:12px;padding:12px 16px 12px 20px;background:var(--needBg);color:var(--needTx);cursor:pointer;transition:background .4s}
.dch{box-shadow:inset 4px 0 0 var(--need)}.dc.done .dch{box-shadow:inset 4px 0 0 var(--ok)}.dc.open .dch{border-bottom:1px solid var(--needBd)}.dc.done .dch{background:#ECF7EF}.dc.done.open .dch{border-bottom-color:var(--okBd)}
.dci{width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--needLine);display:grid;place-items:center;flex:none}.dc.done .dci{border-color:var(--okBd)}
.dct{display:flex;flex-direction:column;gap:2px}.dct b{font-size:15px;font-weight:600}.dct small{font-size:12.5px;color:var(--i2);font-weight:400}
.dc .coll>div>div:last-child{padding-bottom:12px}.dc .coll>div{padding:0 12px 0 16px}
.dc.done .dch{color:var(--okTx)}
.dch .tgl{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:13px}
.drow{background:#fff;border:1px solid var(--l2);border-radius:10px;padding:0 10px 0 14px;min-height:52px;display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;font-weight:500;animation:rise .3s var(--ease)}
.ckb{width:34px;height:32px;border-radius:8px;border:1px solid var(--l2);background:#fff;display:grid;place-items:center}
.ckb:hover{background:var(--sub)}.ckb.on{background:var(--heldBg);border-color:var(--heldBd)}.ckb.onok{background:var(--okBg);border-color:var(--okBd)}
.fix{padding:12px 8px 4px;animation:rise .3s var(--ease)}
.fix label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
.inp{width:100%;height:40px;border:1px solid var(--l2);border-radius:8px;padding:0 12px;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;color:var(--ink);background:#fff}
.inp:focus{border-color:var(--b);box-shadow:0 0 0 3px var(--bBg)}
.help{font-size:12px;color:var(--i3);margin-top:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* banners */
.ban{display:flex;background:#fff;border:1px solid var(--l);border-radius:14px;overflow:hidden;margin-bottom:10px;animation:rise .4s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ban .acc{width:4px;flex:none}.ban .bd{flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.ban.held{border-color:var(--heldBd)}.ban.held .acc{background:var(--held)}.ban.ok .acc{background:var(--ok)}
.hrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--i2)}.hrow b{font-weight:600;color:var(--ink)}.hrow.ok svg{color:var(--okTx)}
.ban .tr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.ban .tr .grow{min-width:300px}
.ban h3{margin:0;font-size:16px;font-weight:600}.ban p{margin:3px 0 0;font-size:13px;color:var(--i2)}
.bico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.cmd{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:var(--sub);border:1px solid var(--l);font-family:var(--mono);font-size:13px}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:13px;color:var(--i2);animation:rise .3s var(--ease)}

.info{display:flex;align-items:center;gap:10px;padding:0 10px 0 16px;height:46px;border-radius:12px;background:var(--s2);border:1px solid var(--l);font-size:14px;font-weight:500;color:var(--i2);margin-bottom:10px;animation:rise .35s var(--spring)}
.info .d{width:7px;height:7px;border-radius:50%;background:var(--i2)}
.okban{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:#F3FAF5;border:1px solid var(--okBd);margin-bottom:10px;animation:rise .4s var(--spring)}

.okban h3{margin:0;font-size:16px;font-weight:600;color:var(--okTx)}.okban p{margin:2px 0 0;font-size:13px;color:var(--i2)}

/* gutter timeline */
.gut{position:absolute;left:0;top:0;width:0;height:100%;pointer-events:none;z-index:3}
.gut>*{pointer-events:auto}
.gseg{position:absolute;width:2px;border-radius:2px;background:var(--light);overflow:hidden;transform:translateX(-1px);transition:top .35s var(--ease),height .35s var(--ease)}
.gseg.plan{background:var(--plan)}
.gseg.gap{background:none;width:0;border-left:1.5px dashed var(--need);overflow:visible;transform:translateX(-.75px)}
.gseg i{position:absolute;inset:0;background:var(--ok);transform-origin:top;transform:scaleY(0);transition:transform .6s var(--ease)}
.gseg.ok{width:3px;transform:translateX(-1.5px)}.gseg.ok i{transform:scaleY(1)}
.gnode{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;transition:top .35s var(--ease)}

.gnode .n.big.gap{box-shadow:inset 0 0 0 2px var(--need)}
.cap{position:absolute;width:28px;border-radius:14px;background:rgba(41,82,255,.10);transform:translateX(-50%);transition:top .6s var(--ease),height .6s var(--ease),background .3s}
.cap.paused{background:rgba(134,134,143,.12)}
.agent{position:absolute;transform:translate(-50%,-50%);transition:top .6s var(--ease);display:flex;align-items:center}
.agent .ring{width:20px;height:20px}.agent .ring i{width:8px;height:8px}
.agent .al{position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);background:var(--b);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.agent.paused .al{background:var(--i3)}.gut.tight .agent .al{right:auto;left:50%;top:auto;bottom:calc(100% + 6px);transform:translateX(-50%)}.gut.tight .hlab{transform:translate(-50%,calc(-100% - 14px))}
.hlab{position:absolute;transform:translate(calc(-100% - 14px),-50%);background:var(--heldTx);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;transition:top .35s}

/* document view */
.docwrap{position:relative;padding:40px 0 140px 0;min-height:100%}
.sheet{position:relative;margin-left:var(--sx,136px);width:808px;background:#fff;border:1px solid var(--l);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.05),0 0 1px rgba(0,0,0,.03);padding:40px 40px 96px 48px}
.dtitle{font-size:32px;font-weight:500;letter-spacing:-.02em;margin:0}

.dsec.gap{box-shadow:inset 0 0 0 1px var(--needLine)}
.dsec.updbar:before{content:"";position:absolute;left:-2px;top:14px;bottom:6px;width:3px;border-radius:3px;background:var(--upd)}
.dh{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;letter-spacing:-.01em;padding:22px 0 8px}
.sheet .ln{font-size:18px;line-height:30px;padding:4px 0}
.sheet .ln .tx{cursor:text}.sheet .ln .tx:hover{background:var(--sub)}
.hlm{background:linear-gradient(#FDE68A,#FDE68A) no-repeat;background-size:100% 100%;color:inherit;border-radius:3px;padding:1px 0;animation:hlin .45s var(--ease)}
.hlm code{background:none}
@keyframes hlin{from{background-size:0% 100%}}
.stb{position:sticky;top:14px;z-index:8;display:flex;align-items:center;gap:2px;width:max-content;margin:-22px 0 18px -14px;background:#fff;border:1px solid var(--l);border-radius:10px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.sbb{position:relative;width:34px;height:30px;border:0;border-radius:7px;background:none;display:grid;place-items:center;color:var(--i2)}
.sbb:hover:not(:disabled){background:var(--s2);color:var(--ink)}.sbb.on{background:#FEF3C7;color:var(--needTx)}.sbb:disabled{color:var(--l2);cursor:default}
.sbt{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;font-weight:500}
.sbb:hover .sbt{opacity:1}.sbs{width:1px;height:18px;background:var(--l);margin:0 3px}
.sheet .ln .tx:hover{background:var(--sub)}
.sheet .ln .tx:focus{background:var(--bBg);box-shadow:0 0 0 2px var(--bBd)}
.margin{position:absolute;left:0;top:0;width:100%;height:0;z-index:20}
.note{position:absolute;width:440px;background:#fff;border:1px solid var(--l);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);padding:16px;animation:rise .35s var(--spring);transition:top .35s var(--ease)}

.nh{display:flex;align-items:flex-start;gap:10px;font-size:14px;font-weight:600;line-height:1.4}

.mvs{display:flex;flex-direction:column;gap:8px}.mvs>div{background:var(--sub);border:1px solid var(--l);border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:20px}.mvs span{display:block;font-size:11.5px;font-weight:600;color:var(--i3);margin-bottom:2px}.mvs code{font-size:12.5px}
.note .rvbox{padding:10px;gap:10px}.note .rvbox .row .btn{height:30px;padding:0 10px;font-size:12.5px}.note .rvh span{display:none}
.eyeb{font-size:11px;font-weight:600;color:var(--i3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.editbox{display:flex;align-items:center;gap:8px;border:1px solid var(--l2);border-radius:8px;padding:9px 10px;font-size:13px;line-height:20px}
.editbox{cursor:text;transition:border-color .15s,box-shadow .15s}.editbox:hover{border-color:var(--i3)}.editbox:focus-within{border-color:var(--b);box-shadow:0 0 0 3px var(--bBg)}
.editbox .ebpre{flex:none;color:var(--i3);font-weight:500}.editbox .ebtx{flex:1;outline:none;min-width:0}
.editbox .ebic{flex:none;width:26px;height:26px;border:0;border-radius:6px;background:none;color:var(--i2);display:grid;place-items:center}.editbox .ebic:hover{background:var(--s2);color:var(--bTx)}
.editbox.big{font-size:15px;margin-bottom:14px}
.selbar{position:absolute;z-index:30;display:flex;gap:2px;background:var(--ink);border-radius:9px;padding:3px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:pop .2s var(--spring)}
.selbar button{display:flex;align-items:center;gap:6px;background:none;border:0;color:#fff;font-size:13px;font-weight:500;padding:6px 10px;border-radius:7px}
.selbar button:hover,.selbar button.on{background:rgba(255,255,255,.14)}
.quote{background:var(--bBg);color:var(--bTx);font-size:12px;border-radius:6px;padding:7px 10px;margin:10px 0}
.msg{display:flex;gap:10px;padding:12px 0 4px}
.msg .mav{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.msg .who{font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:baseline}.msg .who span{font-size:12px;font-weight:400;color:var(--i3)}
.msg .mb{font-size:13.5px;color:var(--i2);line-height:20px;margin-top:2px}
.dots{display:flex;gap:4px;padding:8px 0}.dots i{width:6px;height:6px;border-radius:50%;background:var(--i3);animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.sugg{background:rgba(238,241,255,.6);border:1px solid var(--bBd);border-radius:10px;padding:12px;margin:10px 0 4px;animation:rise .35s var(--spring)}
.sugg .q{background:#fff;border-left:3px solid var(--b);border-radius:6px;padding:8px 10px;font-size:13.5px;line-height:20px;margin:8px 0}
.reply{display:flex;gap:8px;align-items:center;border-top:1px solid var(--l);margin:12px -16px -16px;padding:10px 16px}
.reply input{flex:1;height:32px;border:1px solid var(--l2);border-radius:999px;padding:0 12px;font-family:inherit;font-size:13px;outline:none}
.reply input:focus{border-color:var(--b)}

/* review pane */
.ph{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.ph h2{margin:0;font-size:17px;font-weight:600}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch;margin:4px 0 2px}
.vc{background:#fff;border:1.5px solid var(--l2);border-radius:14px;padding:18px 20px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);animation:rise .4s var(--spring) backwards}
.vc.spec{border-color:var(--bBd);box-shadow:inset 4px 0 0 var(--b),0 2px 10px rgba(41,82,255,.08)}
.vc.bad{background:var(--needSoft);border-color:var(--needLine);box-shadow:inset 4px 0 0 var(--need),0 2px 10px rgba(245,158,11,.10);animation-delay:.08s}
.vc.bad .v{color:var(--needTx)}
.vs .neq{align-self:center;justify-self:center;width:36px;height:36px;border-radius:50%;background:#fff;border:1.5px solid var(--needLine);color:var(--needTx);display:grid;place-items:center;font:600 20px/1 system-ui,-apple-system,'Segoe UI',sans-serif;padding-bottom:2px;z-index:1;animation:pop .4s .15s var(--spring) backwards}
.vc .k{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--i3)}.vc.spec .k{color:var(--bTx)}.vc.bad .k{color:var(--needTx)}.vc .v{font-size:20px;line-height:30px;font-weight:500;letter-spacing:-.01em}.vc .m{font-size:12px;color:var(--i3)}
.whyl{display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--i2);line-height:24px;margin:20px 0}
.hr{height:1px;background:var(--l);margin:4px 0 20px}
.q2{font-size:20px;font-weight:600;margin:0 0 16px}
.cons{display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--i2);margin:18px 0}.cons b{color:var(--ink);font-weight:600}

.stepc{border:1px solid var(--l);border-radius:10px;margin-bottom:8px;background:#fff}

.stepc.cause{border-color:var(--needLine);background:var(--needSoft)}
.stepc.cause .no{background:var(--needBg);color:var(--needTx)}
.codep{background:#fff;border:1px solid var(--l);border-radius:8px;margin:0 10px;padding:10px 0;font-family:var(--mono);font-size:12px;line-height:20px}
.codep .fh{display:flex;justify-content:space-between;padding:0 10px 6px;color:var(--i3)}
.codep .cl{padding:0 10px;white-space:pre}.codep .cl.bad{background:var(--needBg)}.codep .cl.good{background:var(--okBg)}
.codep .lno{color:var(--i3);display:inline-block;width:24px}
.inl-link{font-size:15px;font-weight:500;margin-left:4px;vertical-align:baseline}.opsep{width:1px;height:14px;background:var(--l);margin:0 2px}.opfs{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;color:var(--bTx);white-space:nowrap}.opfs:hover,.inl-link:hover{text-decoration:underline}
.link{color:var(--bTx);font-weight:600;font-size:12px;background:none;border:0;padding:0;display:inline-flex;gap:4px;align-items:center}

.rvbox{border:1px solid var(--l);border-radius:12px;padding:14px;background:var(--sub);animation:rise .3s var(--spring);display:flex;flex-direction:column;gap:12px}

.diff{background:#fff;border:1px solid var(--l);border-radius:8px;overflow:hidden;font-family:var(--mono);font-size:13px;line-height:26px}
.dl{display:flex;gap:10px;padding:0 10px;white-space:pre}.dl span{color:var(--i3);width:18px;text-align:right}.dl i{font-style:normal;width:10px}
.dl.del{background:#FDF1F0;color:#9F2D24}.dl.add{background:var(--okBg);color:#11652F;animation:fade .4s .2s backwards}
.ta{height:auto;padding:10px 12px;line-height:22px;resize:vertical;font-size:15px}
/* compare */
.cmp{padding:20px 22px 60px;background:#fff;min-height:100%}
.cmph{display:flex;align-items:center;gap:12px;margin-bottom:16px}

.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start}
.col{border:1px solid var(--l);border-radius:12px;background:#fff;overflow:hidden}
.colh{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;background:var(--sub);border-bottom:1px solid var(--l);font-size:13px;font-weight:600}

.codebox{background:var(--sub);border:1px solid var(--l);border-radius:8px;padding:8px 0;font-family:var(--mono);font-size:12.5px;line-height:21px}

.trh,.trow2{display:grid;grid-template-columns:30px minmax(0,1fr) 26px minmax(0,1fr) 26px minmax(0,1.25fr) 130px;align-items:start;gap:0 6px}

  <div class="devh"><span class="live"></span>Your phone and watch<span class="grow"></span><button class="ib" style="width:24px;height:24px" aria-label="Close" onClick=${closeDev}>${I('x',13)}</button></div>
  <div class=${'phone'+(res==='new'?' buzz':'')}><div class="scr"><div class="island"></div><div class="clock">${hold?'3:02':'4:12'}</div><div class="date">Monday, November 16</div>
   <div class="pnf"><div class="ah"><span class="appi">${Mark(18)}</span>SPECLINE<span class="grow"></span>now</div>
    ${hold?html`<b>On hold: a migration on production</b><p>Password reset · it breaks a rule in your spec and has no allowed alternative. Only this step waits.</p>`:html`<b>Password reset is done</b><p>Every section matches your spec · 52 min · ready to review.</p>`}
    ${res!=='new'&&hold?html`<div class="pres">${I('check',12)}${resTx}</div>`:''}</div>
   ${res==='new'?html`<div class="pacts">${hold?html`<button onClick=${()=>act('blocked')}>Block</button><button onClick=${openApp}>Open in Specline</button>`:html`<button onClick=${()=>{S.screen='summary';S.summaryOf='live';closeDev();rerender();}}>Open task summary</button>`}</div>`:''}
  </div></div>
  <div class="watch"><div class="wscr">
   ${res!=='new'&&hold?html`<span class="wi" style="background:#1F7A3E">${I('check',16)}</span><b>${d.res==='blocked'?'Blocked':'Allowed once'}</b><span>${res==='app'?'on your computer':'from your phone'}</span>`
   :hold?html`<span class="wi" style="background:#C0362C">${I('octx',16)}</span><b>On hold</b><span>Migration on production</span><div class="wb"><button class="b1" onClick=${()=>act('blocked')}>Block</button></div>`
   :html`<span class="wi" style="background:#1F7A3E">${I('check',16)}</span><b>Done</b><span>Password reset · 7 of 7</span>`}</div></div>
  <div class="devf">${hold?'Only steps that can’t continue without you reach your phone. Overrides happen on your computer.':'Sent when the task finishes.'}</div></aside>`;}
/* ---------- modal + demo ---------- */
function OverrideModal(){return html`<div class="scrim" onClick=${()=>set({modal:null})}><div class="modal" onClick=${e=>e.stopPropagation()}><span class="bico t-held" style="width:36px;height:36px">${I('alert',18)}</span><h3>Allow one change to the users table?</h3>
 <div class="quote" style="background:var(--heldBg);color:var(--heldTx);font-size:13.5px;margin:0 0 12px">“No schema changes to the users table.”</div>
 <p>This lets the agent make one change your rule doesn’t allow:</p><div class="branch" style="margin-bottom:14px">${I('term',14)}ALTER TABLE users ADD COLUMN password_changed_at TIMESTAMP</div>
 <p class="help" style="margin:0 0 18px">Your spec doesn’t change. The exception is recorded in your task summary. To allow changes like this from now on, edit the rule instead.</p>
 <div class="row" style="justify-content:flex-end">${B('Cancel',()=>set({modal:null}))}${B('Allow this change',()=>decideHold('allowed','app'),'d')}</div></div></div>`;}
function EndModal(){return html`<div class="scrim" onClick=${()=>set({modal:null})}><div class="modal" onClick=${e=>e.stopPropagation()}><span class="bico t-held" style="width:36px;height:36px">${I('octx',18)}</span><h3>End this run?</h3><p>The agent stops for good. Everything it wrote so far stays on the branch — nothing is deleted.</p>
 <div class="branch">${I('git',14)}password-reset<span>· ${covered()} of 7 sections done</span></div><p class="help" style="margin:12px 0 18px">You can start a new run from this spec later.</p>
 <div class="row" style="justify-content:flex-end">${B('Keep paused',()=>set({modal:null}))}${B('End run',endRun,'d')}</div></div></div>`;}
function jump(to){clearTimeout(T);const sp=S.speed;S=fresh();S.speed=sp;S.screen='task';S.toast=false;
 const planDone=()=>{S.dec[0].st='ok';S.dec[0].corr=true;S.dec[1].st='ok';S.gap='added';logAdd('gap',{i:'plus',t:'ok',title:'Added plan step 4b — sign out other sessions',sub:'Plan review · was not in plan',line:'w3'});logAdd('d1',{i:'help',t:'work',title:'Corrected: emails use the account’s language',sub:'Plan review · agent decision',line:'e2'});logAdd('d2',{i:'check',t:'ok',title:'Verified: token expiry is checked against server time (UTC)',sub:'Plan review · agent decision',line:'t2'});};
 if(to==='holdask'){S.holdMode='ask';to='hold';}
 const ff=until=>{ORDER.forEach(i=>S.lineSt[i]='idle');S.stage='working';while(S.ptr<ORDER.length&&ORDER[S.ptr]!==until){const id=ORDER[S.ptr];if(id==='l1'&&!S.hold){if(S.holdMode==='ask'){S.hold={st:'open',mode:'ask'};S.lineSt.u1='hold';S.expanded.rules=true;}else handleHold(false);}if(id==='u2'&&S.hold&&S.hold.st==='open'){S.hold.st='blocked';S.label.u2={k:'blocked'};logAdd('hold',{i:'shield',t:'held',title:'Blocked a migration on the production database',sub:'Rule: never run migrations in production',line:'u2'});}finish(id);S.ptr++;}};
 if(to==='doc'){planDone();ff('w1');const p0=S.lines.t2;S.mismatch='updated';S.label.t2={k:'updated',was:'30 minutes',prev:p0};S.lines.t2=['A token expires 1 hour after it’s created.'];S.lineSt.t2='ok';S.spec.t2={k:'Changed',sec:'Reset token',b:'30 minutes',a:'1 hour'};logAdd('t2',{i:'pencil',t:'upd',title:'Reset token: kept 1 hour, updated the spec',sub:'Doesn’t match → Update spec',line:'t2'});
  const pe=S.lines.e1,ne='Subject: “Reset your Acme password”. The link points to /reset?token=…';S.lines.e1=toSegs(ne,['/reset?token=…']);S.label.e1={k:'edited',was:'Subject: “Reset your password”. The link points to /reset?token=…',prev:pe};S.spec['e-e1']={k:'Changed',sec:'Reset email',b:'“Reset your password”',a:'“Reset your Acme password”'};logAdd('e-e1',{i:'pencil',t:'upd',title:'Edited: the reset email subject',sub:'While the agent worked',line:'e1'});
  {const w=plain('w2'),k=w.indexOf('at least 12 characters');S.highlights.w2=[[k,k+22]];}S.threads.l1={st:'open',quote:'At most 3 requests per email per hour…',text:'',sugg:'Emails are compared in lowercase when counting limits.',msgs:[{me:true,when:'4 min ago',text:'Count emails in lowercase, so Bob@x.com and bob@x.com share one limit.'},{me:false,text:'Done — limits.py now lowercases the email before counting. I only changed the code; your spec doesn’t mention this yet.',full:'Done — limits.py now lowercases the email before counting. I only changed the code; your spec doesn’t mention this yet.',file:'limits.py · line 22'}]};
  S.view='doc';rerender();setTimeout(()=>{const el=document.querySelector('[data-anchor="e1"]');el&&el.scrollIntoView({block:'start'});document.querySelector('.scroller').scrollTop-=60;},120);after(loop,600);return;}
 if(to==='working'){planDone();ORDER.forEach(i=>S.lineSt[i]='idle');S.stage='working';rerender();after(loop,500);return;}
 if(to==='mismatch'){planDone();ff('e1');rerender();after(loop,300);return;}
 if(to==='hold'){planDone();ff('l1');S.mismatch='updated';S.label.t2={k:'updated',was:'30 minutes',prev:S.lines.t2};S.lines.t2=['A token expires 1 hour after it’s created.'];S.lineSt.t2='ok';S.spec.t2={k:'Changed',sec:'Reset token',b:'30 minutes',a:'1 hour'};logAdd('t2',{i:'pencil',t:'upd',title:'Reset token: kept 1 hour, updated the spec',sub:'Doesn’t match → Update spec',line:'t2'});rerender();after(loop,300);after(()=>{if(!S.hold)triggerHold();},900);return;}
 if(['final','done','summary'].includes(to)){planDone();ff(null);S.mismatch='updated';S.label.t2={k:'updated',was:'30 minutes',prev:S.lines.t2};S.lines.t2=['A token expires 1 hour after it’s created.'];S.lineSt.t2='ok';S.spec.t2={k:'Changed',sec:'Reset token',b:'30 minutes',a:'1 hour'};logAdd('t2',{i:'pencil',t:'upd',title:'Reset token: kept 1 hour, updated the spec',sub:'Doesn’t match → Update spec',line:'t2'});S.agentDone=true;
  if(to==='final'){S.stage='final';S.fptr=0;rerender();after(floop,400);return;}
  S.final='fixed';S.label.g2={k:'ffixed'};logAdd('final',{i:'check',t:'ok',title:'Fixed: the reset link is no longer logged',sub:'Found in the final check',line:'g2'});S.stage='done';S.result='Done';if(to==='summary')S.screen='summary';}
 rerender();}
function Demo(){if(!S.demoOpen)return html`<div class="demo"><button class="op" onClick=${()=>set({demoOpen:true})}>${I('sliders',13)}Demo</button></div>`;const J=(l,k)=>html`<button onClick=${()=>{S.demoOpen=false;if(k==='plan'){clearTimeout(T);const sp=S.speed;S=fresh();S.speed=sp;S.screen='task';S.toast=false;rerender();}else jump(k);}}>${l}</button>`;
 return html`<div class="demo"><div class="pn2"><h6>AGENT SPEED</h6><div class="sp">${[1,2,4].map(v=>html`<button class=${S.speed===v?'on':''} onClick=${()=>set({speed:v})}>${v}×</button>`)}</div>
  <h6>JUMP TO A MOMENT</h6><div class="g">${J('Plan review','plan')}${J('Agent working','working')}${J('Doesn’t match','mismatch')}${J('Blocked · handled','hold')}${J('On hold · users table','holdask')}${J('Final check','final')}${J('Done','done')}${J('Task summary','summary')}${J('Edit & comment','doc')}<button onClick=${()=>{clearTimeout(T);const sp=S.speed;S=fresh();S.speed=sp;S.demoOpen=false;rerender();}}>Restart</button></div></div>
  <button class="op" onClick=${()=>set({demoOpen:false})}>${I('x',13)}Close</button></div>`;}

/* ---------- app ---------- */
function Task(){const pane=S.screen==='task'&&S.file==='spec'&&!S.compare&&S.view==='doc'&&(!!S.tracePane||(S.gapPane&&isPlan()&&S.gap==='open'&&S.view==='sections')||(S.review&&(S.mismatch==='open'||S.mismatch==='applying'))||(S.steps&&S.final==='open'));
 let content;if(S.file==='plan')content=html`<div class="scroller white"><${PlanFile}/></div>`;else if(S.compare)content=html`<div class="scroller white"><${Compare}/></div>`;
 else content=html`<div class="scroller">${S.view==='doc'?html`<${DocView}/>`:html`<${SectionsView}/>`}</div>`;
 return html`<div class="shell"><${TopBar}/><${StatusBar}/><${ViewBar}/>
  <div class=${'main'+(S.dev&&!S.dev.out?' devopen':'')} style=${{'--ol':S.outline&&S.file!=='plan'&&!S.compare?'260px':'0px','--pane':pane?(S.dev&&!S.dev.out?'560px':'800px'):'0px'}}><${Outline}/>${content}<aside class="pane" style=${pane?'':'border-left-width:0'}>${pane?(S.tracePane?html`<${TracePane}/>`:S.gapPane&&isPlan()&&S.gap==='open'&&S.view==='sections'?html`<${GapReview}/>`:S.steps?html`<${Steps}/>`:html`<${Review}/>`):''}</aside></div>
  ${S.modal==='end'?html`<${EndModal}/>`:''}${S.modal==='override'?html`<${OverrideModal}/>`:''}</div>`;}
function App(){useEffect(()=>{if(S.changed){const c=S.changed;setTimeout(()=>{if(S.changed===c)S.changed=null;},1700);}});
 let body;if(S.screen==='home')body=html`<div class="shell"><${TopBar}/><${Home}/></div>`;else if(S.screen==='summary')body=html`<div class="shell"><${TopBar}/>${S.stage!=='ended'&&S.summaryOf==='live'?html`<${StatusBar}/><${ViewBar}/>`:''}<div style="flex:1;min-height:0"><${Summary}/></div></div>`;else body=html`<${Task}/>`;
 return html`${body}<${Devices}/>`;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal)set({modal:null});else if(S.review)set({review:false});else if(S.steps)set({steps:false});else if(S.compare)set({compare:null,tracePane:S.compare,view:'sections'});else if(S.sel)set({sel:null});}});
rerender();
</script>
